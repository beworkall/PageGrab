name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - run: gradle assembleDebug --no-daemon

      - name: Read version name
        id: ver
        run: echo "name=$(grep -m1 'versionName =' app/build.gradle.kts | sed -E 's/.*"(.*)".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PageGrab-${{ steps.ver.outputs.name }}-debug.apk

      # Build artifact for quick testing (every push)
      - uses: actions/upload-artifact@v4
        with:
          name: PageGrab-APK
          path: PageGrab-${{ steps.ver.outputs.name }}-debug.apk

      # Public "latest" GitHub Release with a direct download link — same flow as Sealbox
      - name: Publish latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "PageGrab (latest build — v${{ steps.ver.outputs.name }})"
          body: "Auto-built from the latest commit on main. Debug-signed — unsigned for a real Play release, fine for direct install. See README for setup."
          files: PageGrab-${{ steps.ver.outputs.name }}-debug.apk
